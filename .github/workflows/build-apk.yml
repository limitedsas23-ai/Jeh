name: Build Legitiv Linux APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '.github/workflows/build-apk.yml'
      - 'tools/bootstrap-libtermux.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Legitiv
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare LibTermux source
        run: ./tools/bootstrap-libtermux.sh

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legitiv-linux-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
