name: Build Legitiv Linux APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          mkdir -p source
          unzip -q LegitivLinux-embedded-0.3.1-source-integrated.zip -d source
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/LegitivLinux-embedded-0.3.1" >> "$GITHUB_ENV"
          ls -la source/LegitivLinux-embedded-0.3.1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare LibTermux source
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tools/bootstrap-libtermux.sh

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Assemble debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legitiv-linux-debug-apk
          path: source/LegitivLinux-embedded-0.3.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
