name: Build Legitiv Linux APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [[ -z "$ZIP_FILE" ]]; then echo 'No project ZIP found in repository root'; exit 1; fi
          unzip -q -o "$ZIP_FILE" -d source
          PROJECT_DIR="$(dirname "$(find source -type f -name settings.gradle.kts -print -quit)")"
          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/gradlew" ]]; then echo 'Could not find Gradle project in ZIP'; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare LibTermux source
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash ./tools/bootstrap-libtermux.sh

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegitivLinux-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
